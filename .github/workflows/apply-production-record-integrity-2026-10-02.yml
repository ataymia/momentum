name: Apply production record integrity 2026-10-02

on:
  push:
    branches:
      - production-record-integrity-2026-10-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/apply-production-record-integrity-2026-10-02.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "ataymia"
          git config user.email "ataymia.murray@allstarservicesnow.com"
          git add lib/workspace-context.tsx lib/delivery-context.tsx components/pages/work-v2.tsx tests/production-record-consistency.test.ts
          git commit -m "Make production record mutations cloud-confirmable"
          git push origin HEAD:production-record-integrity-2026-10-02
