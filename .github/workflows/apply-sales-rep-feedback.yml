name: Apply sales rep feedback

on:
  push:
    branches:
      - sales-rep-feedback-2026-09-16

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sales-rep-feedback-2026-09-16

      - name: Apply focused production fixes
        run: python scripts/apply-sales-rep-feedback.py

      - name: Verify code and production build
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:logic
          npm run build

      - name: Commit tested fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/workspace-context.tsx components/pages/accounts.tsx components/pages/dispatch-board.tsx lib/workspace-normalization.ts lib/commercial-state.ts lib/csv-data-exchange.ts lib/employee-profile.ts tests/post-launch-regressions.test.ts
          git commit -m "Fix sales rep account capture and revisit scheduling"
          git push origin HEAD:sales-rep-feedback-2026-09-16
