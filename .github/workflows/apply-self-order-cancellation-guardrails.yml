name: Apply cancellation permission guardrails

on:
  push:
    branches:
      - hotfix-self-order-cancellation-2026-09-29
    paths:
      - scripts/apply-self-order-cancellation-guardrails.py
      - .github/workflows/apply-self-order-cancellation-guardrails.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hotfix-self-order-cancellation-2026-09-29
          fetch-depth: 0
      - name: Apply guardrails
        run: python3 scripts/apply-self-order-cancellation-guardrails.py
      - name: Commit generated changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/commerce-context.tsx lib/delivery-context.tsx components/pages/orders-v3.tsx tests/order-cancellation-delivery.test.ts
          git commit -m "Tighten order cancellation cross-domain permissions"
          git push origin HEAD:hotfix-self-order-cancellation-2026-09-29
