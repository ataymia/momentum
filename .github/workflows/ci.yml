name: Momentum Full Platform Audit

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: momentum-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Git integrity check
        run: git diff --check

      - name: Typecheck application
        run: npm run typecheck

      - name: Lint application
        run: npm run lint

      - name: Critical and full logic regression tests
        run: npm run test:logic

      - name: Firestore security rules regression tests
        run: npm run test:rules

      - name: Verify generated Firestore rules are committed
        run: git diff --exit-code -- firestore.rules

      - name: Compile Firebase Functions
        run: npm --prefix functions run build

      - name: Lint Firebase Functions
        run: npm --prefix functions run lint

      - name: Production build
        run: npm run build

      - name: Verify audit did not mutate tracked source
        run: git diff --exit-code
