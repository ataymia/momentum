name: Momentum Connected Functional Acceptance

on:
  push:
    branches:
      - stabilization/production-workflows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MOMENTUM_FIREBASE_WEB_API_KEY: isolated-emulator-key
      NEXT_PUBLIC_FIREBASE_API_KEY: isolated-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-momentum-connected-audit.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-momentum-connected-audit
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-momentum-connected-audit.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:0000000000000000000000"
      NEXT_PUBLIC_FIREBASE_FUNCTIONS_BASE_URL: http://127.0.0.1:5001/demo-momentum-connected-audit/us-central1
      NEXT_PUBLIC_INVOICE_ISSUE_APPROVED: "false"
      MOMENTUM_INVOICE_ISSUE_APPROVED: "false"
      RESEND_LIVE_EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install and build isolated connected app and functions
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts
          npm --prefix functions run build
          npm run build
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Run real connected browser tests on local-only emulator project
        run: |
          printf 'MOMENTUM_FIREBASE_WEB_API_KEY=isolated-emulator-key\n' > functions/.env.local
          printf 'RESEND_API_KEY=disabled-local-test\nRESEND_WEBHOOK_SECRET=disabled-local-test\n' > functions/.secret.local
          npx --yes firebase-tools@15.30.1 emulators:exec --only auth,firestore,storage,functions,hosting --project demo-momentum-connected-audit --config firebase.connected-audit.json 'node --import tsx scripts/connected-functional-audit.mjs'
      - name: Upload per-route and per-action evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-connected-functional-audit
          path: artifacts/connected-functional-audit/
          if-no-files-found: warn
          retention-days: 21
