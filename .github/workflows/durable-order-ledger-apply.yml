name: Apply and validate durable order ledger

on:
  push:
    branches:
      - urgent-durable-order-ledger-2026-09-24
    paths:
      - scripts/apply-durable-order-ledger.py
      - scripts/apply-durable-order-normalization.py
      - lib/durable-order-api.ts
      - functions/src/order-ledger.ts
      - tests/durable-order-ledger.test.ts
      - .github/workflows/durable-order-ledger-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out durable order branch
        uses: actions/checkout@v4
        with:
          ref: urgent-durable-order-ledger-2026-09-24
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply durable order patches
        run: |
          python3 scripts/apply-durable-order-ledger.py
          python3 scripts/apply-durable-order-normalization.py

      - name: Install application dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Lint application
        run: npm run lint

      - name: Logic regression tests
        run: npm run test:logic

      - name: Firestore rules regression tests
        run: npm run test:rules

      - name: Compile Firebase Functions
        run: npm --prefix functions run build

      - name: Lint Firebase Functions
        run: npm --prefix functions run lint

      - name: Production build
        run: npm run build

      - name: Whitespace integrity
        run: git diff --check

      - name: Commit validated durable order implementation
        run: |
          git config user.name "Momentum Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git commit -m "Make order submission durable across users"
          git push origin HEAD:urgent-durable-order-ledger-2026-09-24
