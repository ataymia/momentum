name: Fix account email function lint

on:
  push:
    branches:
      - account-email-profile-management-2026-10-01

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply formatting cleanup
        run: python scripts/fix-account-email-function-lint.py
      - name: Commit source and remove temporary fix files
        run: |
          git config user.name "ataymia"
          git config user.email "ataymia.murray@allstarservicesnow.com"
          git rm scripts/fix-account-email-function-lint.py .github/workflows/fix-account-email-function-lint.yml
          git add functions/src/index.ts
          git commit -m "Fix account email Firebase Function lint"
          git push origin HEAD:account-email-profile-management-2026-10-01
