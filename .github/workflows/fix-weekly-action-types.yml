name: Fix weekly action type narrowing

on:
  push:
    branches:
      - weekly-report-goals-2026-10-04

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weekly-report-goals-2026-10-04
          fetch-depth: 0
      - name: Narrow weekly action records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("components/work/action-center-v4.tsx")
          text = path.read_text()
          old_import = 'import { reportVisibleTo, weeklyProgressVisibleTo, weeklyReportingObligations } from "../../lib/performance-engine";'
          new_import = 'import { reportVisibleTo, weeklyProgressVisibleTo, weeklyReportingObligations, type WeeklyProgressReport } from "../../lib/performance-engine";'
          old_filter = 'performance.reports.filter((report)=>report.type==="Weekly progress"&&report.status==="Submitted"&&report.userId!==currentUser.id&&weeklyProgressVisibleTo(currentUser,report,data))'
          new_filter = 'performance.reports.filter((report):report is WeeklyProgressReport=>report.type==="Weekly progress"&&report.status==="Submitted"&&report.userId!==currentUser.id&&weeklyProgressVisibleTo(currentUser,report,data))'
          if old_import not in text:
              raise SystemExit("Expected performance import not found")
          if old_filter not in text:
              raise SystemExit("Expected weekly filter not found")
          text = text.replace(old_import, new_import, 1).replace(old_filter, new_filter, 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/work/action-center-v4.tsx
          git commit -m "Narrow weekly required action report types"
          git push origin HEAD:weekly-report-goals-2026-10-04
