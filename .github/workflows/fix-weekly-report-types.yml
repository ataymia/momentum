name: Fix weekly reporting type narrowing

on:
  push:
    branches:
      - weekly-report-goals-2026-10-04

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weekly-report-goals-2026-10-04
          fetch-depth: 0
      - name: Narrow legacy reporting center to legacy report types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("components/performance/reporting-center.tsx")
          text = path.read_text()
          old = 'const visibleReports=performance.reports.filter((report)=>reportVisibleTo(currentUser,report,data)).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt));'
          new = 'const visibleReports=performance.reports.filter((report):report is DailyWorkReport|ManagerWeeklyReport=>reportVisibleTo(currentUser,report,data)).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt));'
          if old not in text:
              raise SystemExit("Expected ReportingCenter expression not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/performance/reporting-center.tsx
          git commit -m "Narrow legacy reporting center report types"
          git push origin HEAD:weekly-report-goals-2026-10-04
