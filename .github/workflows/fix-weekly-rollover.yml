name: Tighten weekly report rollover logic

on:
  push:
    branches:
      - weekly-report-rollover-guard-2026-10-04

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weekly-report-rollover-guard-2026-10-04
          fetch-depth: 0
      - name: Apply strict adjacent-week rollover rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          engine = Path("lib/performance-engine.ts")
          text = engine.read_text()
          pattern = re.compile(r'export function weeklyCarryForwardGoals\(state:PerformanceState,userId:string,weekStart:string\)\{.*?\n\}', re.S)
          replacement = '''export function weeklyCarryForwardGoals(state:PerformanceState,userId:string,weekStart:string){
            const priorWeekStart=addCalendarDays(weekStart,-7);
            const prior=weeklyProgressReportFor(state,userId,priorWeekStart);
            return prior?.nextWeekGoals?.length===3?prior.nextWeekGoals.map((goal)=>goal.trim()||"N/A"):["N/A","N/A","N/A"];
          }
          export function rollForwardNextWeekDraft(draft:WeeklyProgressDraft,nextWeekGoals:string[],updatedAt:string):WeeklyProgressDraft{
            const normalized=nextWeekGoals.slice(0,3).map((goal)=>goal.trim()||"N/A");
            if(normalized.length!==3)return draft;
            return{...draft,goals:normalized.map((goal,index)=>{
              const current=draft.goals[index];
              return current?.goal.trim()===goal?{...current,goal}:{goal,actual:goal==="N/A"?"N/A":"",notes:""};
            }),updatedAt};
          }'''.replace("          ", "")
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"weeklyCarryForwardGoals replacement count={count}")
          engine.write_text(text)

          context = Path("lib/performance-context.tsx")
          text = context.read_text()
          old_import = 'import { DailyWorkReport, ManagerWeeklyReport, PERFORMANCE_STORAGE_KEY, PerformanceGoal, PerformanceState, WeeklyGoalResult, WeeklyProgressDraft, WeeklyProgressReport, WorkReport, ReportNote, canViewPerformanceRecord, createPerformanceSeed, managerWeeklyMetrics, normalizePerformanceState, userCommercialMetrics, weeklyCarryForwardGoals, weeklyProgressDraftFor, weeklyProgressReportFor, weeklyReportingPeriod } from "./performance-engine";'
          new_import = 'import { DailyWorkReport, ManagerWeeklyReport, PERFORMANCE_STORAGE_KEY, PerformanceGoal, PerformanceState, WeeklyGoalResult, WeeklyProgressDraft, WeeklyProgressReport, WorkReport, ReportNote, canViewPerformanceRecord, createPerformanceSeed, managerWeeklyMetrics, normalizePerformanceState, rollForwardNextWeekDraft, userCommercialMetrics, weeklyCarryForwardGoals, weeklyProgressDraftFor, weeklyProgressReportFor, weeklyReportingPeriod } from "./performance-engine";'
          if old_import not in text:
              raise SystemExit("performance context import not found")
          text = text.replace(old_import,new_import,1)
          submit_pattern = re.compile(r'    const id=uid\("weekly-report"\);const report:WeeklyProgressReport=\{id,type:"Weekly progress",userId:currentUser\.id,weekStart:draft\.weekStart,weekEnd:draft\.weekEnd,dueDate:draft\.dueDate,submittedAt:now\(\),status:"Submitted",goals,summary:draft\.summary\.trim\(\),nextWeekGoals\};\n    commit\(\(state\)=>\(\{\.\.\.state,reports:\[report,\.\.\.state\.reports\],weeklyDrafts:state\.weeklyDrafts\.filter\(\(item\)=>item\.id!==draftId\)\}\)\);return id;')
          submit_replacement = '''    const id=uid("weekly-report");const submittedAt=now();const report:WeeklyProgressReport={id,type:"Weekly progress",userId:currentUser.id,weekStart:draft.weekStart,weekEnd:draft.weekEnd,dueDate:draft.dueDate,submittedAt,status:"Submitted",goals,summary:draft.summary.trim(),nextWeekGoals};
            commit((state)=>({...state,reports:[report,...state.reports],weeklyDrafts:state.weeklyDrafts.filter((item)=>item.id!==draftId).map((item)=>item.userId===currentUser.id&&item.weekStart===draft.dueDate?rollForwardNextWeekDraft(item,nextWeekGoals,submittedAt):item)}));return id;'''.replace("          ", "")
          text, count = submit_pattern.subn(submit_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"weekly submit replacement count={count}")
          context.write_text(text)

          tests = Path("tests/weekly-reporting.test.ts")
          text = tests.read_text()
          if 'rollForwardNextWeekDraft,' not in text:
              text = text.replace('  normalizePerformanceState,\n', '  normalizePerformanceState,\n  rollForwardNextWeekDraft,\n', 1)
          marker = '''test("next-week goals carry into the next weekly report",()=>{
            const state:PerformanceState={...createPerformanceSeed(),reports:[submittedReport("2026-10-05",["Close 3 accounts","Complete 80 visits","Get 2 reorders"])]};
            assert.deepEqual(weeklyCarryForwardGoals(state,"usr-rep","2026-10-12"),["Close 3 accounts","Complete 80 visits","Get 2 reorders"]);
          });'''.replace("          ", "")
          addition = marker + '''

          test("carry-forward never skips a missing immediately previous week",()=>{
            const state:PerformanceState={...createPerformanceSeed(),reports:[submittedReport("2026-10-05",["A","B","C"])]};
            assert.deepEqual(weeklyCarryForwardGoals(state,"usr-rep","2026-10-19"),["N/A","N/A","N/A"]);
          });

          test("late submission repairs an already-open next-week draft without erasing future planning",()=>{
            const draft={
              id:"draft-next",userId:"usr-rep",weekStart:"2026-10-12",weekEnd:"2026-10-18",dueDate:"2026-10-19",
              createdAt:"2026-10-12T08:00:00.000Z",updatedAt:"2026-10-12T08:00:00.000Z",
              goals:[{goal:"N/A",actual:"N/A",notes:""},{goal:"N/A",actual:"N/A",notes:""},{goal:"N/A",actual:"N/A",notes:""}],
              summary:"",nextWeekGoals:["Future 1","Future 2","Future 3"],
            };
            const repaired=rollForwardNextWeekDraft(draft,["Close 3 accounts","Complete 80 visits","Get 2 reorders"],"2026-10-12T12:00:00.000Z");
            assert.deepEqual(repaired.goals,[
              {goal:"Close 3 accounts",actual:"",notes:""},
              {goal:"Complete 80 visits",actual:"",notes:""},
              {goal:"Get 2 reorders",actual:"",notes:""},
            ]);
            assert.deepEqual(repaired.nextWeekGoals,["Future 1","Future 2","Future 3"]);
          });'''.replace("          ", "")
          if 'carry-forward never skips a missing immediately previous week' not in text:
              if marker not in text:
                  raise SystemExit("weekly rollover test marker not found")
              text = text.replace(marker,addition,1)
          tests.write_text(text)
          PY
      - name: Commit rollover guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/performance-engine.ts lib/performance-context.tsx tests/weekly-reporting.test.ts
          git commit -m "Guard weekly report goal rollover"
          git push origin HEAD:weekly-report-rollover-guard-2026-10-04
