name: Format scoped CRM Functions once
on:
  push:
    branches:
      - audit/monday-integration-20261012
    paths:
      - .github/workflows/format-crm-functions-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the development candidate
        uses: actions/checkout@v4
      - name: Use Node 24 for Firebase Functions
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install only Firebase Functions dependencies
        run: npm --prefix functions ci --ignore-scripts
      - name: Auto-fix Google ESLint formatting in four staged CRM files
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
        run: |
          cd functions
          ./node_modules/.bin/eslint --fix \
            src/account-profile-edit.ts \
            src/account-profile-policy.ts \
            src/trusted-account-creation.ts \
            src/trusted-account-validation.ts || true
      - name: Commit only those formatter changes to this development branch
        run: |
          git diff --check
          git config user.name "Momentum CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            functions/src/account-profile-edit.ts \
            functions/src/account-profile-policy.ts \
            functions/src/trusted-account-creation.ts \
            functions/src/trusted-account-validation.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize staged CRM Functions formatting"
            git push origin HEAD:refs/heads/audit/monday-integration-20261012
          fi
