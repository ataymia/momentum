name: Validate order cloud acknowledgement repair

on:
  push:
    branches:
      - urgent-order-ack-access-state-2026-09-24
    paths:
      - scripts/apply-order-ack-access-state.py
      - .github/workflows/order-cloud-ack-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: urgent-order-ack-access-state-2026-09-24
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply order acknowledgement repair
        run: python3 scripts/apply-order-ack-access-state.py

      - name: Install application dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm --prefix functions ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Logic regression tests
        run: npm run test:logic

      - name: Firestore rules regression tests
        run: npm run test:rules

      - name: Functions build
        run: npm --prefix functions run build

      - name: Functions lint
        run: npm --prefix functions run lint

      - name: Production build
        run: npm run build

      - name: Whitespace check
        run: git diff --check

      - name: Commit validated repair
        run: |
          git config user.name "Momentum Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Require confirmed cloud persistence for orders"
          git push origin HEAD:urgent-order-ack-access-state-2026-09-24
