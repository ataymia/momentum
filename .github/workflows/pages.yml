name: Deploy Momentum to GitHub Pages

on:
  push:
    branches:
      - codex/momentum-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Run expanded logic tests
        run: npm run test:logic
      - name: Report launch readiness
        run: npm run readiness
      - name: Export static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify Pages artifact
        run: npm run verify:pages
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Run six-role browser launch acceptance
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null
          command -v chromedriver >/dev/null
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          rm -rf .launch-site
          mkdir -p ".launch-site${BASE_PATH}"
          cp -R out/. ".launch-site${BASE_PATH}/"
          python3 -m http.server 4173 --directory .launch-site >/tmp/momentum-http.log 2>&1 &
          HTTP_PID=$!
          chromedriver --port=9515 >/tmp/momentum-chromedriver.log 2>&1 &
          DRIVER_PID=$!
          cleanup() {
            kill "$HTTP_PID" "$DRIVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9515/status >/dev/null && curl --fail --silent "http://127.0.0.1:4173${BASE_PATH}/" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Browser acceptance services did not become ready."
              cat /tmp/momentum-http.log || true
              cat /tmp/momentum-chromedriver.log || true
              exit 1
            fi
            sleep 1
          done
          BASE_URL="http://127.0.0.1:4173${BASE_PATH}/" node scripts/launch-browser-smoke.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
