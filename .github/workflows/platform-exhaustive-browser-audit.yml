name: Momentum Exhaustive Product and Visual Audit

on:
  # Every production candidate gets actual browser interaction checks, not only source tests.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - integration/a-g-unified-2026-11-07
      - release-candidate/2026-11-16-premerge-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: momentum-full-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install dependencies without invoking production tooling
        run: npm ci --ignore-scripts
      - name: Build static review app with invoice issuance held
        run: NEXT_PUBLIC_INVOICE_ISSUE_APPROVED=false npm run build
      - name: Install isolated Chromium browser
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Block release on failed staff routes, role isolation, navigation and real demo interactions
        run: npx --yes firebase-tools@15.30.1 emulators:exec --only hosting --project demo-momentum-product-review --config firebase.architecture-smoke.json 'node scripts/platform-exhaustive-browser-audit.mjs'
      - name: Upload findings and responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-exhaustive-audit
          path: artifacts/full-platform-audit/
          if-no-files-found: warn
          retention-days: 21
      - name: Ensure no application source files changed
        if: always()
        run: git diff --exit-code
