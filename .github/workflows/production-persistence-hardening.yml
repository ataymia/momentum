name: Validate production persistence hardening

on:
  push:
    branches:
      - production-persistence-hardening-2026-10-01

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Apply production hardening patches
        run: |
          python scripts/apply-production-persistence-hardening-2026-10-01.py
          python scripts/apply-order-creator-search-2026-10-01.py
      - name: Install application dependencies
        run: npm ci
      - name: Run full platform audit
        run: npm test
      - name: Validate Firebase Functions
        run: |
          npm --prefix functions ci
          npm --prefix functions run lint
          npm --prefix functions run build
      - name: Production build
        run: npm run build
      - name: Commit validated source
        run: |
          git config user.name "Momentum Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/workspace-context.tsx components/pages/dashboard.tsx components/inventory/inventory-ledger-panel-v2.tsx components/pages/marketing.tsx components/app-shell-v4.tsx tests/production-record-consistency.test.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Harden cross-account order state persistence"
          git push origin HEAD:production-persistence-hardening-2026-10-01
