name: Validate production record consistency repair

on:
  push:
    branches:
      - production-record-consistency-2026-10-01
    paths:
      - scripts/apply-production-record-consistency.py
      - .github/workflows/production-record-consistency-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: production-record-consistency-2026-10-01
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply production repair
        run: python3 scripts/apply-production-record-consistency.py

      - name: Install application dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm --prefix functions ci

      - name: Git integrity check
        run: git diff --check

      - name: Typecheck application
        run: npm run typecheck

      - name: Lint application
        run: npm run lint

      - name: Logic regression tests
        run: npm run test:logic

      - name: Firestore security rules regression tests
        run: npm run test:rules

      - name: Verify generated Firestore rules are committed
        run: npm run rules:check

      - name: Compile Firebase Functions
        run: npm --prefix functions run build

      - name: Lint Firebase Functions
        run: npm --prefix functions run lint

      - name: Production build
        run: npm run build

      - name: Commit validated repair
        run: |
          rm scripts/apply-production-record-consistency.py
          rm .github/workflows/production-record-consistency-apply.yml
          git config user.name "Momentum Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Harden production record consistency across sessions"
          git push origin HEAD:production-record-consistency-2026-10-01
