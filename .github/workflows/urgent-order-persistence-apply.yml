name: Urgent order persistence repair

on:
  push:
    branches:
      - urgent-order-persistence-notification-size-2026-09-23
    paths:
      - scripts/apply-urgent-order-persistence-v1.py
      - scripts/apply-urgent-order-persistence-v2.py
      - scripts/apply-urgent-order-persistence-v3.py
      - .github/workflows/urgent-order-persistence-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out urgent branch
        uses: actions/checkout@v4
        with:
          ref: urgent-order-persistence-notification-size-2026-09-23
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply urgent repair
        run: |
          python3 scripts/apply-urgent-order-persistence-v1.py
          python3 scripts/apply-urgent-order-persistence-v2.py
          python3 scripts/apply-urgent-order-persistence-v3.py

      - name: Install application dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm --prefix functions ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Logic regression tests
        run: npm run test:logic

      - name: Firestore security rules regression tests
        run: npm run test:rules

      - name: Compile Firebase Functions
        run: npm --prefix functions run build

      - name: Lint Firebase Functions
        run: npm --prefix functions run lint

      - name: Production build
        run: npm run build

      - name: Verify patch did not leave whitespace errors
        run: git diff --check

      - name: Commit validated repair
        run: |
          git config user.name "Momentum Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Harden order persistence and notification storage"
          git push origin HEAD:urgent-order-persistence-notification-size-2026-09-23
